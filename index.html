<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>架空地图生成器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="ui">
        <h2>架空地图生成器</h2>
        <button id="generateBtn">生成新地图</button>
        <button id="toggle3DBtn" style="background-color: #3498db;">进入 3D 视图</button>
<button id="exportBtn" style="background-color: #27ae60;">导出高清图片</button>

<div id="legendContainer" style="margin-top: 10px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; font-size: 12px; display: none;">
    <div id="legendTitle" style="font-weight: bold; margin-bottom: 5px; color: #fff;">图例</div>
    <div id="legendContent" style="display: flex; flex-wrap: wrap; gap: 5px;"></div>
</div>

        <div class="control">
            <label>国家数量: <input type="number" id="nationCount" value="12" min="0" max="50"></label>
        </div>
        <div class="control">
            <label>板块数量: <input type="number" id="plateCount" value="6" min="2" max="20"></label>
        </div>
        <div class="control">
            <label>海平面高度: <input type="range" id="seaLevel" value="70" min="50" max="90">%</label>
        </div>
        <div class="control">
            <label>显示模式: 
                <select id="viewMode">
                    <option value="terrain">地形混合</option>
                    <option value="political">政治地图</option>
                    <option value="pure_terrain">纯地形</option>
                    <option value="contour">纯等高线</option>
                    <option value="climate">气候热力图</option>
                    <option value="biome">自然群系分布图</option>
                </select>
            </label>
        </div>
        <div class="control">
            <label>显示经纬网: <input type="checkbox" id="showGrid" checked></label>
        </div>
        <div class="control">
            <label>显示洋流系统: <input type="checkbox" id="showOceanCurrents"></label>
        </div>
        <div class="control">
            <label>显示国家与边界: <input type="checkbox" id="showNations" checked></label>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="importDataBtn" style="background-color: #d35400; padding: 10px; font-size: 14px; margin-bottom: 0;">导入配置</button>
            <button id="exportDataBtn" style="background-color: #8e44ad; padding: 10px; font-size: 14px; margin-bottom: 0;">导出配置</button>
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
        </div>
        <div class="legend" id="legend"></div>
    </div>
    <div id="map-container">
        <canvas id="mapCanvas"></canvas>
    </div>

    <!-- 导出图片时长按保存的模态框 -->
    <div id="exportModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="closeModal">返回</span>
                <button id="directDownloadBtn" style="background-color: #27ae60; padding: 10px 20px; font-size: 14px; font-weight: bold; color: white; border: none; border-radius: 5px; cursor: pointer;">直接下载图片</button>
            </div>
            <p style="margin: 15px 0; font-size: 14px; font-weight: bold; color: #2ecc71;">电脑端请点击上方“直接下载”，手机端也可长按下方图片保存</p>
            <img id="exportedImg" src="" alt="High Res Map">
        </div>
    </div>

    <!-- 3D 地球渲染引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
